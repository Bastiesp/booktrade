<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BookTrade Admin Pro</title>
<!-- admin-final-fix-v2 -->
<style>
body{margin:0;background:#F8FAFC;color:#111827;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #BFDBFE;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;z-index:10}
h1{margin:0;color:#2563EB}.wrap{max-width:1280px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat,.card{background:#fff;border:1px solid #BFDBFE;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.stat b{font-size:28px;color:#2563EB}.stat span{display:block;font-size:12px;color:#64748B}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,.tabs button{border:0;border-radius:999px;background:#3B82F6;color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}.secondary{background:#fff!important;color:#475569!important;border:1px solid #BFDBFE!important}.danger{background:#991B1B!important}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #DBEAFE;text-align:left;font-size:13px;vertical-align:top}th{background:#EFF6FF;color:#475569;font-size:11px;text-transform:uppercase}
.pill{display:inline-flex;border-radius:999px;padding:3px 8px;background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;font-size:11px;font-weight:900}
.input{border:1px solid #BFDBFE;border-radius:12px;padding:11px 12px;min-width:260px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #BFDBFE}pre{white-space:pre-wrap;background:#0F172A;color:#fff;border-radius:12px;padding:12px;font-size:12px}
.center{max-width:520px;margin:70px auto;text-align:center}
.err{color:#991B1B;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>BookTrade Admin Pro</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn secondary" onclick="location.href='/'">Volver a la app</button>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<div class="wrap">
  <div id="loading" class="center card">
    <h2>Abriendo panel administrador...</h2>
    <p>Usando tu sesión actual de BookTrade.</p>
    <div id="loadhint" style="font-size:13px;color:#64748B;margin-top:8px">Validando permisos...</div>
  </div>

  <div id="noaccess" class="center card" style="display:none">
    <h2>No se pudo abrir el panel</h2>
    <p id="noaccess-msg">Inicia sesión en la app con tu cuenta administradora.</p>
    <button class="btn" onclick="location.href='/'">Ir a BookTrade</button>
  </div>

  <div id="panel" style="display:none">
    <div id="who" class="card" style="margin-bottom:14px"></div>
    <div id="stats" class="grid"></div>
    <div class="tabs">
      <button onclick="loadUsers()">Usuarios</button>
      <button onclick="loadBooks()">Libros</button>
      <button onclick="loadExchanges('all')">Intercambios</button>
      <button onclick="loadExchanges('completed')">Intercambiados</button>
      <button onclick="loadExchanges('pending')">En proceso / Match</button>
      <button onclick="loadReports()">Reportes</button>
      <button onclick="loadVerifications()">Verificar fotos</button>
      <button onclick="loadActions()">Historial admin</button>
      <button class="secondary" onclick="refresh()">Actualizar KPIs</button>
    </div>
    <div id="content" class="card"></div>
  </div>
</div>

<script>
window.addEventListener('error',e=>{
  const el=document.getElementById('loadhint');
  if(el)el.innerHTML='<div class="err">Error JS: '+(e.message||'desconocido')+'</div>';
});

let TOKEN=localStorage.getItem('bs_token')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function api(method,path,body){
  const h={'Content-Type':'application/json'};
  if(TOKEN)h.Authorization='Bearer '+TOKEN;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined,signal:controller.signal});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Error '+r.status);
    return d;
  }finally{
    clearTimeout(timer);
  }
}

function showNoAccess(message){
  $('loading').style.display='none';
  $('panel').style.display='none';
  $('noaccess').style.display='block';
  $('noaccess-msg').textContent=message||'Inicia sesión en la app con tu cuenta administradora.';
}

function showPanel(){
  $('loading').style.display='none';
  $('noaccess').style.display='none';
  $('panel').style.display='block';
}

function logout(){
  localStorage.removeItem('bs_token');
  localStorage.removeItem('bs_user');
  location.href='/';
}

async function refresh(){
  try{
    if(!TOKEN)return showNoAccess('No hay sesión activa. Vuelve a la app e inicia sesión.');
    $('loadhint').textContent='Validando administrador...';
    const w=await api('GET','/api/admin/whoami');
    if(!w.isAdmin)return showNoAccess('Tu usuario no tiene permiso de administrador.');
    showPanel();
    $('who').innerHTML='<b>Admin conectado:</b> '+esc(w.user.email)+' · rol '+esc(w.user.role);
    await summary();
    await loadUsers();
  }catch(e){
    showNoAccess(e.name==='AbortError'?'La solicitud tardó demasiado. Reintenta o revisa el deploy.':e.message);
  }
}

async function summary(){
  const s=await api('GET','/api/admin/summary');
  const data={'Usuarios':s.users,'Admins':s.admins,'Bloqueados':s.blocked,'Eliminados':s.deleted,'Libros':s.books,'Libros activos':s.activeBooks,'Intercambiados':s.completed,'En proceso':s.pending,'Mensajes':s.messages,'Reportes abiertos':s.reportsOpen,'Fotos pendientes':s.pendingVerifications,'Nuevos este mes':s.newUsersMonth};
  $('stats').innerHTML=Object.entries(data).map(([k,v])=>'<div class="stat"><b>'+(v||0)+'</b><span>'+esc(k)+'</span></div>').join('');
}

function searchBox(fn,ph){
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <input id="q" class="input" placeholder="${esc(ph)}" onkeydown="if(event.key==='Enter')window[fn]()">
    <button class="btn" onclick="window[fn]()">Buscar</button>
  </div>`;
}

async function loadUsers(){
  const q=$('q')?.value||'';
  const includeDeleted=$('includeDeleted')?.checked?'&includeDeleted=true':'';
  const rows=await api('GET','/api/admin/users?q='+encodeURIComponent(q)+includeDeleted);

  let html=`<h2>Usuarios</h2>${searchBox('loadUsers','Buscar usuario, email o comuna')}
  <label style="display:flex;align-items:center;gap:8px;margin:8px 0 12px;font-size:13px;color:#475569">
    <input id="includeDeleted" type="checkbox" onchange="loadUsers()" ${includeDeleted?'checked':''}> Mostrar eliminados
  </label>
  <table><tr><th>Usuario</th><th>Datos</th><th>Rol/Estado</th><th>Actividad</th><th>Creación</th><th>Acciones</th></tr>`;

  html+=rows.map(u=>{
    const deleted=u.accountStatus==='deleted';
    const makeRole=u.role==='admin'?'user':'admin';
    const makeStatus=u.accountStatus==='blocked'?'active':'blocked';

    const actions=deleted
      ? `<span class="pill" style="background:#FEE2E2;color:#991B1B;border-color:#FECACA">Eliminado</span>`
      : `<button class="btn secondary" onclick="role('${u._id}','${makeRole}')">${u.role==='admin'?'Quitar admin':'Hacer admin'}</button>
         <button class="btn secondary" onclick="statusUser('${u._id}','${makeStatus}')">${u.accountStatus==='blocked'?'Activar':'Bloquear'}</button>
         ${u.profilePhoto&&u.verificationStatus!=='verified'?`<button class="btn" onclick="verifyPhoto('${u._id}','verified')">Verificar foto</button>`:''}
         <button class="btn danger" onclick="deleteUser('${u._id}')">Eliminar</button>`;

    return `<tr>
      <td>${u.profilePhoto?`<img class="avatar" src="${esc(u.profilePhoto)}">`:''}<br><b>@${esc(u.username)}</b><br>${esc(u.email)}</td>
      <td>${esc(u.location||'Sin comuna')}<br>⭐ ${Number(u.ratingAvg||0).toFixed(1)} (${u.ratingCount||0})<br>${esc(u.verificationStatus||'pending')}</td>
      <td><span class="pill">${esc(u.role||'user')}</span><br><span class="pill">${esc(u.accountStatus||'active')}</span></td>
      <td>${u.totalBooks||0} libros<br>${u.completedExchanges||0} intercambios<br>${esc(u.level||'Aficionado')}</td>
      <td>${new Date(u.createdAt).toLocaleString('es-CL')}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');

  html+='</table>';
  $('content').innerHTML=html;
}

async function role(id,role){await api('PUT','/api/admin/users/'+id+'/role',{role});loadUsers();summary();}
async function statusUser(id,status){await api('PUT','/api/admin/users/'+id+'/status',{status});loadUsers();summary();}
async function deleteUser(id){
  if(!confirm('¿Eliminar usuario?\n\nEl usuario desaparecerá del listado normal y sus libros quedarán no disponibles.'))return;
  try{await api('DELETE','/api/admin/users/'+id);alert('Usuario eliminado correctamente');await loadUsers();await summary();}catch(e){alert('No se pudo eliminar: '+e.message);}
}

async function loadBooks(){
  const q=$('q')?.value||'';
  const rows=await api('GET','/api/admin/books?q='+encodeURIComponent(q));
  $('content').innerHTML=`<h2>Libros</h2>${searchBox('loadBooks','Buscar título, autor o género')}
  <table><tr><th>Libro</th><th>Dueño</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr>
  ${rows.map(b=>`<tr>
    <td>${b.photos?.[0]?`<img style="width:50px;height:68px;object-fit:cover;border-radius:8px" src="${esc(b.photos[0])}">`:''}<br><b>${esc(b.title)}</b><br>${esc(b.author)} · ${esc(b.genre)}</td>
    <td>@${esc(b.owner?.username||'—')}<br>${esc(b.owner?.email||'')}</td>
    <td><span class="pill">${b.available?'Activo':'No disponible'}</span></td>
    <td>${new Date(b.createdAt).toLocaleString('es-CL')}</td>
    <td><button class="btn danger" onclick="delBook('${b._id}')">Eliminar libro</button></td>
  </tr>`).join('')}</table>`;
}
async function delBook(id){if(confirm('¿Eliminar libro?')){await api('DELETE','/api/admin/books/'+id);loadBooks();summary();}}

async function loadExchanges(status){
  const rows=await api('GET','/api/admin/exchanges?status='+encodeURIComponent(status||'all'));
  $('content').innerHTML=`<h2>Intercambios</h2><table><tr><th>Usuarios</th><th>Libros</th><th>Estado</th><th>Fecha</th></tr>
  ${rows.map(x=>`<tr>
    <td>${((x.participants||[]).map(p=>'@'+esc(p.username)+'<br>'+esc(p.email)).join('<hr>'))}</td>
    <td>${esc(x.myBook?.title||'—')} ⇄ ${esc(x.theirBook?.title||'—')}</td>
    <td><span class="pill">${esc(x.status)}</span></td>
    <td>${new Date(x.updatedAt).toLocaleString('es-CL')}</td>
  </tr>`).join('')}</table>`;
}

async function loadReports(){
  const rows=await api('GET','/api/admin/reports');
  $('content').innerHTML=`<h2>Reportes / Contacto admin</h2><table><tr><th>Reporta</th><th>Reportado/libro</th><th>Motivo</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr>
  ${rows.map(r=>`<tr>
    <td>@${esc(r.reporter?.username||'—')}<br>${esc(r.reporter?.email||'')}</td>
    <td>${r.reportedUser?'@'+esc(r.reportedUser.username):''}${r.book?'<br>📘 '+esc(r.book.title):''}</td>
    <td>${esc(r.reason)}</td>
    <td><span class="pill">${esc(r.status)}</span></td>
    <td>${new Date(r.createdAt).toLocaleString('es-CL')}</td>
    <td><button class="btn secondary" onclick="reportStatus('${r._id}','reviewing')">Revisando</button> <button class="btn secondary" onclick="reportStatus('${r._id}','resolved')">Resuelto</button> <button class="btn secondary" onclick="reportStatus('${r._id}','dismissed')">Descartar</button></td>
  </tr>`).join('')}</table>`;
}
async function reportStatus(id,status){await api('PUT','/api/admin/reports/'+id,{status});loadReports();summary();}

async function loadVerifications(){
  const rows=await api('GET','/api/admin/verifications');
  $('content').innerHTML=`<h2>Verificación de fotos de perfil</h2>
  ${!rows.length?'<div style="padding:26px;text-align:center;color:#64748B">No hay fotos pendientes.</div>':
  `<table><tr><th>Foto</th><th>Usuario</th><th>Datos</th><th>Estado</th><th>Acciones</th></tr>
  ${rows.map(u=>`<tr>
    <td>${u.profilePhoto?`<a href="${esc(u.profilePhoto)}" target="_blank"><img class="avatar" src="${esc(u.profilePhoto)}" style="width:76px;height:76px"></a>`:'Sin foto'}</td>
    <td><b>@${esc(u.username)}</b><br>${esc(u.email)}</td>
    <td>${esc(u.location||'Sin comuna')}<br>${u.completedExchanges||0} intercambios<br>${esc(u.level||'Aficionado')}</td>
    <td><span class="pill">${esc(u.verificationStatus||'pending')}</span></td>
    <td><button class="btn" onclick="verifyPhoto('${u._id}','verified')">Aprobar</button> <button class="btn secondary" onclick="verifyPhoto('${u._id}','rejected')">Rechazar</button></td>
  </tr>`).join('')}</table>`}`;
}
async function verifyPhoto(id,status){await api('PUT','/api/admin/users/'+id+'/verification',{status});await summary();await loadVerifications();}

async function loadActions(){
  const rows=await api('GET','/api/admin/actions');
  $('content').innerHTML=`<h2>Historial acciones admin</h2><table><tr><th>Admin</th><th>Acción</th><th>Target</th><th>Detalle</th><th>Fecha</th></tr>
  ${rows.map(a=>`<tr>
    <td>@${esc(a.admin?.username||'—')}<br>${esc(a.admin?.email||'')}</td>
    <td><span class="pill">${esc(a.action)}</span></td>
    <td>${esc(a.targetType)}<br>${esc(a.targetId)}</td>
    <td><pre>${esc(JSON.stringify(a.detail||{},null,2))}</pre></td>
    <td>${new Date(a.createdAt).toLocaleString('es-CL')}</td>
  </tr>`).join('')}</table>`;
}

window.loadUsers=loadUsers;
window.loadBooks=loadBooks;
window.loadReports=loadReports;
window.loadVerifications=loadVerifications;
window.loadActions=loadActions;
window.refresh=refresh;
document.addEventListener('DOMContentLoaded',refresh);
setTimeout(()=>{if($('loading')&&$('loading').style.display!=='none')showNoAccess('El panel tardó demasiado en abrir. Recarga la página o verifica que el deploy esté activo.');},18000);

</script>
</body>
</html>
