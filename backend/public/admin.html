<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BookTrade Admin Pro</title>
<!-- admin-pro-dashboard-users-reports-role-fix-v2 -->
<style>
:root{--blue:#3B82F6;--blue2:#0B5ED7;--soft:#EFF6FF;--line:#BFDBFE;--text:#111827;--muted:#64748B;--red:#991B1B;--green:#047857;--yellow:#B45309}
*{box-sizing:border-box}body{margin:0;background:#F8FAFC;color:var(--text);font-family:Arial,system-ui,sans-serif}
header{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;z-index:20}
h1{margin:0;color:var(--blue2);font-size:22px}.wrap{max-width:1380px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.stat,.card,.panel-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.045)}
.stat{position:relative;overflow:hidden}.stat b{font-size:28px;color:var(--blue2)}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.stat small{display:block;font-size:11px;color:#94A3B8;margin-top:5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,.tabs button{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}.secondary{background:#fff!important;color:#475569!important;border:1px solid var(--line)!important}.danger{background:#991B1B!important}.green{background:#047857!important}.yellow{background:#B45309!important}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #DBEAFE;text-align:left;font-size:13px;vertical-align:top}th{background:var(--soft);color:#475569;font-size:11px;text-transform:uppercase}
.pill{display:inline-flex;border-radius:999px;padding:4px 9px;background:var(--soft);color:#2563EB;border:1px solid var(--line);font-size:11px;font-weight:900;align-items:center;gap:4px}.pill.red{background:#FEF2F2;color:#991B1B;border-color:#FECACA}.pill.green{background:#ECFDF5;color:#047857;border-color:#A7F3D0}.pill.yellow{background:#FFFBEB;color:#B45309;border-color:#FDE68A}
.input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:#111827}.input{min-width:260px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}pre{white-space:pre-wrap;background:#0F172A;color:#fff;border-radius:12px;padding:12px;font-size:12px}
.center{max-width:520px;margin:70px auto;text-align:center}.err{color:#991B1B;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:12px;margin-top:12px}
.health{display:flex;align-items:center;gap:12px}.dot{width:12px;height:12px;border-radius:50%;background:#22C55E}.dot.warning{background:#F59E0B}.dot.critical{background:#EF4444}
.split{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.mini-list{display:flex;flex-direction:column;gap:10px}.item{border:1px solid #DBEAFE;background:#fff;border-radius:14px;padding:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}.modal-card{width:min(980px,96vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 90px rgba(15,23,42,.28)}
.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid #DBEAFE;padding:16px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modal-body{padding:16px}.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.kpi{background:#F8FAFC;border:1px solid #DBEAFE;border-radius:14px;padding:12px;text-align:center}.kpi b{font-size:22px;color:var(--blue2)}.kpi span{display:block;font-size:11px;color:var(--muted)}
@media(max-width:800px){.split{grid-template-columns:1fr}.wrap{padding:12px}.tabs{gap:6px}.btn,.tabs button{padding:9px 11px;font-size:12px}.input{min-width:0;width:100%}table{display:block;overflow:auto}.modal-card{width:96vw}}
</style>
</head>
<body>
<header>
  <h1>BookTrade Admin Pro</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn secondary" onclick="location.href='/'">Volver a la app</button>
    <button class="btn secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<div class="wrap">
  <div id="loading" class="center card"><h2>Abriendo panel administrador...</h2><p>Usando tu sesión actual de BookTrade.</p><div id="loadhint" style="font-size:13px;color:#64748B;margin-top:8px">Validando permisos...</div></div>
  <div id="noaccess" class="center card" style="display:none"><h2>No se pudo abrir el panel</h2><p id="noaccess-msg">Inicia sesión en la app con tu cuenta administradora.</p><button class="btn" onclick="location.href='/'">Ir a BookTrade</button></div>

  <div id="panel" style="display:none">
    <div id="who" class="card" style="margin-bottom:14px"></div>
    <div id="stats" class="grid"></div>
    <div class="tabs">
      <button onclick="loadDashboard()">Dashboard</button>
      <button onclick="loadUsers()">Usuarios</button>
      <button onclick="loadBooks()">Libros</button>
      <button onclick="loadExchanges('all')">Intercambios</button>
      <button onclick="loadReports()">Reportes</button>
      <button onclick="loadVerifications()">Verificar fotos</button>
      <button onclick="loadActions()">Historial admin</button>
      <button class="secondary" onclick="loadDashboard()">Ver dashboard</button>
      <button class="secondary" onclick="refresh()">Actualizar</button>
    </div>
    <div id="content" class="card"></div>
  </div>
</div>
<div id="modal-root"></div>

<script>
window.addEventListener('error',e=>{const el=document.getElementById('loadhint');if(el)el.innerHTML='<div class="err">Error JS: '+(e.message||'desconocido')+'</div>';});
let TOKEN=localStorage.getItem('bs_token')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d).toLocaleString('es-CL'):'—';
const pill=(txt,cls='')=>`<span class="pill ${cls}">${esc(txt)}</span>`;
function statusCls(s){return s==='resolved'?'green':s==='dismissed'?'red':s==='waiting_user'?'yellow':s==='reviewing'?'yellow':''}
function priorityCls(p){return p==='critical'||p==='high'?'red':p==='low'?'green':''}

async function api(method,path,body){
  const h={'Content-Type':'application/json'}; if(TOKEN)h.Authorization='Bearer '+TOKEN;
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),16000);
  try{const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined,signal:controller.signal}); const d=await r.json().catch(()=>({})); if(!r.ok)throw new Error(d.error||'Error '+r.status); return d;} finally{clearTimeout(timer);}
}
function showNoAccess(message){$('loading').style.display='none';$('panel').style.display='none';$('noaccess').style.display='block';$('noaccess-msg').textContent=message||'Inicia sesión en la app con tu cuenta administradora.'}
function showPanel(){$('loading').style.display='none';$('noaccess').style.display='none';$('panel').style.display='block'}
function logout(){localStorage.removeItem('bs_token');localStorage.removeItem('bs_user');location.href='/'}
function modal(html){$('modal-root').innerHTML=`<div class="modal" onclick="if(event.target.className==='modal')closeModal()"><div class="modal-card">${html}</div></div>`}
function closeModal(){$('modal-root').innerHTML=''}
function searchBox(fn,ph){return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="q" class="input" placeholder="${esc(ph)}" onkeydown="if(event.key==='Enter')window[fn]()"><button class="btn" onclick="window[fn]()">Buscar</button></div>`}

async function refresh(){
  try{
    if(!TOKEN)return showNoAccess('No hay sesión activa. Vuelve a la app e inicia sesión.');
    const w=await api('GET','/api/admin/whoami'); if(!w.isAdmin)return showNoAccess('Tu usuario no tiene permiso de administrador.');
    showPanel(); $('who').innerHTML='<div class="health"><span class="dot"></span><div><b>Admin conectado:</b> '+esc(w.user.email)+' · rol '+esc(w.user.role)+'<br><span style="font-size:12px;color:#64748B">Panel operativo y listo para moderación.</span></div></div>';
    await summary(); await loadDashboard();
  }catch(e){showNoAccess(e.name==='AbortError'?'La solicitud tardó demasiado. Reintenta o revisa el deploy.':e.message)}
}

async function summary(){
  const s=await api('GET','/api/admin/summary');
  const data={'Usuarios':s.users,'Libros':s.books,'Intercambios':s.completed,'En proceso':s.pending,'Reportes abiertos':s.reportsOpen,'Fotos pendientes':s.pendingVerifications,'Bloqueados':s.blocked,'Mensajes':s.messages};
  $('stats').innerHTML=Object.entries(data).map(([k,v])=>`<div class="stat"><b>${v||0}</b><span>${esc(k)}</span></div>`).join('');
}

async function loadDashboard(){
  const d=await api('GET','/api/admin/dashboard');
  const h=d.health||'ok'; const hc=h==='critical'?'critical':h==='warning'?'warning':'';
  const k=d.kpis||{};
  $('who').innerHTML=`<div class="health"><span class="dot ${hc}"></span><div><b>Estado general:</b> ${h==='critical'?'Atención crítica':h==='warning'?'Hay pendientes':'Todo normal'}<br><span style="font-size:12px;color:#64748B">Reportes abiertos: ${k.reportsOpen||0} · Fotos pendientes: ${k.pendingVerifications||0} · Mensajes 24h: ${k.messagesDay||0}</span></div></div>`;

  const kpis=[
    ['Usuarios',k.users,'+'+(k.usersWeek||0)+' esta semana'],
    ['Libros activos',k.activeBooks,(k.booksWeek||0)+' nuevos semana'],
    ['Intercambios hechos',k.exchangesCompleted,(k.exchangesWeek||0)+' mov. semana'],
    ['Reportes abiertos',k.reportsOpen,(k.reportsCritical||0)+' alta prioridad'],
    ['Fotos pendientes',k.pendingVerifications,'por aprobar/rechazar'],
    ['Mensajes',k.messages,(k.messagesDay||0)+' últimas 24h']
  ];

  $('content').innerHTML=`<h2>Dashboard visual</h2>
    <div class="grid" style="margin-bottom:16px">${kpis.map(x=>`<div class="stat"><b>${x[1]||0}</b><span>${esc(x[0])}</span><small>${esc(x[2])}</small></div>`).join('')}</div>
    <div class="split">
      <div class="panel-card"><h3>Alertas y reportes recientes</h3>
        <div class="mini-list">${(d.recentReports||[]).length?(d.recentReports||[]).map(r=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc((r.reason||'Reporte').slice(0,80))}</b>${pill(r.status,statusCls(r.status))}</div><div style="font-size:12px;color:#64748B;margin-top:6px">Reporta: @${esc(r.reporter?.username||'—')} ${r.reportedUser?'· Reportado: @'+esc(r.reportedUser.username):''} ${r.book?'· Libro: '+esc(r.book.title):''}</div><div style="margin-top:8px"><button class="btn secondary" onclick="openReportDetail('${r._id}')">Ver detalle</button></div></div>`).join(''):'<div class="item">Sin reportes pendientes.</div>'}</div>
      </div>
      <div class="panel-card"><h3>Comunidad</h3>
        <h4>Usuarios destacados</h4>
        <div class="mini-list">${(d.topUsers||[]).map(u=>`<div class="item" style="display:flex;gap:10px;align-items:center">${u.profilePhoto?`<img class="avatar" src="${esc(u.profilePhoto)}">`:''}<div style="flex:1"><b>@${esc(u.username)}</b><br><span style="font-size:12px;color:#64748B">${esc(u.location||'Sin comuna')} · ${u.completedExchanges||0} intercambios</span></div><button class="btn secondary" onclick="openUserDetail('${u._id}')">Ficha</button></div>`).join('')||'<div class="item">Sin usuarios.</div>'}</div>
        <h4>Géneros más publicados</h4>
        ${(d.topGenres||[]).map(g=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #DBEAFE;padding:6px 0"><span>${esc(g._id||'Sin género')}</span><b>${g.count}</b></div>`).join('')}
        <h4>Comunas con actividad</h4>
        ${(d.comunas||[]).map(g=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #DBEAFE;padding:6px 0"><span>${esc(g._id||'Sin comuna')}</span><b>${g.count}</b></div>`).join('')}
      </div>
    </div>
    <div class="panel-card" style="margin-top:14px"><h3>Actividad admin reciente</h3><table><tr><th>Admin</th><th>Acción</th><th>Detalle</th><th>Fecha</th></tr>${(d.actions||[]).map(a=>`<tr><td>@${esc(a.admin?.username||'—')}</td><td>${pill(a.action)}</td><td><pre>${esc(JSON.stringify(a.detail||{},null,2))}</pre></td><td>${fmt(a.createdAt)}</td></tr>`).join('')}</table></div>`;
}

async function loadUsers(){
  const q=$('q')?.value||''; const includeDeleted=$('includeDeleted')?.checked?'&includeDeleted=true':'';
  const rows=await api('GET','/api/admin/users?q='+encodeURIComponent(q)+includeDeleted);
  $('content').innerHTML=`<h2>Usuarios</h2>${searchBox('loadUsers','Buscar usuario, email o comuna')}
  <label style="display:flex;align-items:center;gap:8px;margin:8px 0 12px;font-size:13px;color:#475569"><input id="includeDeleted" type="checkbox" onchange="loadUsers()" ${includeDeleted?'checked':''}> Mostrar eliminados</label>
  <table><tr><th>Usuario</th><th>Datos</th><th>Rol/Estado</th><th>Actividad</th><th>Creación</th><th>Acciones</th></tr>
  ${rows.map(u=>{const deleted=u.accountStatus==='deleted'; const makeRole=u.role==='admin'?'user':'admin'; const makeStatus=u.accountStatus==='blocked'?'active':'blocked'; return `<tr>
    <td>${u.profilePhoto?`<img class="avatar" src="${esc(u.profilePhoto)}">`:''}<br><b>@${esc(u.username)}</b><br>${esc(u.email)}</td>
    <td>${esc(u.location||'Sin comuna')}<br>⭐ ${Number(u.ratingAvg||0).toFixed(1)} (${u.ratingCount||0})<br>${esc(u.verificationStatus||'pending')}</td>
    <td>${pill(u.role||'user')}<br>${pill(u.accountStatus||'active',u.accountStatus==='blocked'?'red':'')}</td>
    <td>${u.totalBooks||0} libros<br>${u.completedExchanges||0} intercambios<br>${esc(u.level||'Aficionado')}</td>
    <td>${fmt(u.createdAt)}</td>
    <td>${deleted?pill('Eliminado','red'):`<button class="btn secondary" onclick="openUserDetail('${u._id}')">Ficha</button> <button class="btn secondary" onclick="changeRole('${u._id}','${makeRole}')">${u.role==='admin'?'Quitar admin':'Hacer admin'}</button> <button class="btn secondary" onclick="statusUser('${u._id}','${makeStatus}')">${u.accountStatus==='blocked'?'Activar':'Bloquear'}</button> ${u.profilePhoto&&u.verificationStatus!=='verified'?`<button class="btn" onclick="verifyPhoto('${u._id}','verified')">Verificar foto</button>`:''} <button class="btn danger" onclick="deleteUser('${u._id}')">Eliminar</button>`}</td>
  </tr>`}).join('')}</table>`;
}

async function openUserDetail(id){
  const d=await api('GET','/api/admin/users/'+id+'/detail'); const u=d.user,s=d.stats||{};
  modal(`<div class="modal-head"><div><h2 style="margin:0">Ficha de @${esc(u.username)}</h2><div style="font-size:12px;color:#64748B">${esc(u.email)} · creado ${fmt(u.createdAt)}</div></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div>
  <div class="modal-body">
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">${u.profilePhoto?`<img class="avatar" src="${esc(u.profilePhoto)}" style="width:82px;height:82px">`:''}<div><h3 style="margin:0">@${esc(u.username)}</h3><div>${pill(u.role||'user')} ${pill(u.accountStatus||'active',u.accountStatus==='blocked'?'red':'')} ${pill(u.verificationStatus||'pending')}</div><div style="font-size:13px;color:#64748B;margin-top:6px">📍 ${esc(u.location||'Sin comuna')} · Nivel ${esc(u.level||'Aficionado')} · ⭐ ${Number(u.ratingAvg||0).toFixed(1)} (${u.ratingCount||0})</div></div></div>
    <div class="kpi-row">${[['Libros',s.books],['Activos',s.activeBooks],['Completados',s.completed],['Pendientes',s.pending],['Reportes abiertos',s.openReports],['Mensajes',s.messagesCount]].map(x=>`<div class="kpi"><b>${x[1]||0}</b><span>${x[0]}</span></div>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0"><button class="btn secondary" onclick="changeRole('${u._id}','${u.role==='admin'?'user':'admin'}');closeModal();setTimeout(loadUsers,300)">Cambiar rol</button><button class="btn secondary" onclick="statusUser('${u._id}','${u.accountStatus==='blocked'?'active':'blocked'}');closeModal();setTimeout(loadUsers,300)">${u.accountStatus==='blocked'?'Activar':'Bloquear'}</button><button class="btn danger" onclick="deleteUser('${u._id}');closeModal()">Eliminar usuario</button></div>
    <div class="split">
      <div><h3>Libros del usuario</h3><table><tr><th>Libro</th><th>Estado</th><th>Fecha</th></tr>${(d.books||[]).map(b=>`<tr><td>${b.photos?.[0]?`<img style="width:38px;height:52px;object-fit:cover;border-radius:6px" src="${esc(b.photos[0])}">`:''} <b>${esc(b.title)}</b><br>${esc(b.author||'')}</td><td>${pill(b.available?'Activo':'No disponible',b.available?'green':'yellow')}</td><td>${fmt(b.createdAt)}</td></tr>`).join('')}</table></div>
      <div><h3>Reportes recibidos</h3><div class="mini-list">${(d.reportsReceived||[]).map(r=>`<div class="item"><b>${esc((r.reason||'').slice(0,100))}</b><br>${pill(r.status,statusCls(r.status))}<br><span style="font-size:12px;color:#64748B">${fmt(r.createdAt)}</span></div>`).join('')||'<div class="item">Sin reportes.</div>'}</div></div>
    </div>
    <h3>Intercambios recientes</h3><table><tr><th>Usuarios</th><th>Libros</th><th>Estado</th><th>Fecha</th></tr>${(d.exchanges||[]).map(x=>`<tr><td>${(x.participants||[]).map(p=>'@'+esc(p.username)).join('<br>')}</td><td>${esc(x.myBook?.title||'—')} ⇄ ${esc(x.theirBook?.title||'—')}</td><td>${pill(x.status,x.status==='completed'?'green':'yellow')}</td><td>${fmt(x.updatedAt)}</td></tr>`).join('')}</table>
    <h3>Acciones admin sobre este usuario</h3><table><tr><th>Admin</th><th>Acción</th><th>Detalle</th><th>Fecha</th></tr>${(d.adminActions||[]).map(a=>`<tr><td>@${esc(a.admin?.username||'—')}</td><td>${pill(a.action)}</td><td><pre>${esc(JSON.stringify(a.detail||{},null,2))}</pre></td><td>${fmt(a.createdAt)}</td></tr>`).join('')}</table>
  </div>`);
}

async function changeRole(id,newRole){
  try{
    if(!id||!newRole)return alert('Faltan datos para cambiar el rol');

    const ok=confirm(newRole==='admin'
      ? '¿Convertir este usuario en administrador?'
      : '¿Quitar permisos de administrador a este usuario?');

    if(!ok)return;

    await api('PUT','/api/admin/users/'+id+'/role',{role:newRole});
    alert(newRole==='admin'?'Usuario convertido en admin':'Rol actualizado');

    await summary();
    await loadUsers();
    try{await loadDashboard();}catch{}
  }catch(e){
    alert('No se pudo cambiar el rol: '+(e.message||e));
  }
}
async function statusUser(id,status){await api('PUT','/api/admin/users/'+id+'/status',{status});loadUsers();summary()}
async function deleteUser(id){if(!confirm('¿Eliminar usuario?'))return; try{await api('DELETE','/api/admin/users/'+id);alert('Usuario eliminado');await loadUsers();await summary()}catch(e){alert('No se pudo eliminar: '+e.message)}}

async function loadReports(){
  const rows=await api('GET','/api/admin/reports');
  $('content').innerHTML=`<h2>Reportes mejorados</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn secondary" onclick="loadReports()">Todos</button><button class="btn secondary" onclick="filterReports('open')">Abiertos</button><button class="btn secondary" onclick="filterReports('reviewing')">En revisión</button><button class="btn secondary" onclick="filterReports('waiting_user')">Espera usuario</button><button class="btn secondary" onclick="filterReports('resolved')">Resueltos</button></div>
  <div id="reportsTable">${reportsTable(rows)}</div>`;
  window._reportsRows=rows;
}
function filterReports(st){$('reportsTable').innerHTML=reportsTable((window._reportsRows||[]).filter(r=>r.status===st))}
function reportsTable(rows){return `<table><tr><th>Reporta</th><th>Reportado/libro</th><th>Motivo</th><th>Estado</th><th>Prioridad</th><th>Fecha</th><th>Acción</th></tr>${rows.map(r=>`<tr><td>@${esc(r.reporter?.username||'—')}<br>${esc(r.reporter?.email||'')}</td><td>${r.reportedUser?'@'+esc(r.reportedUser.username):''}${r.book?'<br>📘 '+esc(r.book.title):''}</td><td>${esc((r.reason||'').slice(0,160))}</td><td>${pill(r.status,statusCls(r.status))}</td><td>${pill(r.priority||'normal',priorityCls(r.priority))}</td><td>${fmt(r.createdAt)}</td><td><button class="btn secondary" onclick="openReportDetail('${r._id}')">Detalle</button> <button class="btn secondary" onclick="reportStatus('${r._id}','reviewing')">Revisando</button> <button class="btn green" onclick="reportStatus('${r._id}','resolved')">Resolver</button></td></tr>`).join('')}</table>`}

async function openReportDetail(id){
  const d=await api('GET','/api/admin/reports/'+id+'/detail'); const r=d.report;
  modal(`<div class="modal-head"><div><h2 style="margin:0">Detalle de reporte</h2><div style="font-size:12px;color:#64748B">${fmt(r.createdAt)} · ${pill(r.status,statusCls(r.status))} ${pill(r.priority||'normal',priorityCls(r.priority))}</div></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div>
  <div class="modal-body">
    <div class="split">
      <div class="panel-card"><h3>Motivo</h3><p style="line-height:1.5">${esc(r.reason)}</p><h3>Nota interna admin</h3><textarea id="adminNote" style="width:100%;min-height:120px">${esc(r.adminNote||'')}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><select id="reportStatus"><option value="open">Abierto</option><option value="reviewing">En revisión</option><option value="waiting_user">Espera usuario</option><option value="resolved">Resuelto</option><option value="dismissed">Descartado</option></select><select id="reportPriority"><option value="low">Baja</option><option value="normal">Normal</option><option value="high">Alta</option><option value="critical">Crítica</option></select><button class="btn" onclick="saveReportDetail('${r._id}')">Guardar</button></div></div>
      <div class="panel-card"><h3>Personas</h3><p><b>Reporta:</b> @${esc(r.reporter?.username||'—')}<br>${esc(r.reporter?.email||'')}</p><p><b>Reportado:</b> ${r.reportedUser?'@'+esc(r.reportedUser.username)+'<br>'+esc(r.reportedUser.email):'—'}</p>${r.reportedUser?`<button class="btn secondary" onclick="openUserDetail('${r.reportedUser._id}')">Ver ficha usuario</button> <button class="btn danger" onclick="statusUser('${r.reportedUser._id}','blocked')">Bloquear reportado</button>`:''}${r.book?`<h3>Libro</h3><p>📘 ${esc(r.book.title)}<br>${esc(r.book.author||'')}</p>`:''}</div>
    </div>
    <h3>Reportes relacionados</h3><table><tr><th>Reporte</th><th>Estado</th><th>Fecha</th></tr>${(d.related||[]).map(x=>`<tr><td>${esc((x.reason||'').slice(0,120))}</td><td>${pill(x.status,statusCls(x.status))}</td><td>${fmt(x.createdAt)}</td></tr>`).join('')}</table>
  </div>`);
  setTimeout(()=>{if($('reportStatus'))$('reportStatus').value=r.status;if($('reportPriority'))$('reportPriority').value=r.priority||'normal'},20);
}
async function saveReportDetail(id){await api('PUT','/api/admin/reports/'+id,{status:$('reportStatus').value,priority:$('reportPriority').value,adminNote:$('adminNote').value});alert('Reporte actualizado');closeModal();loadReports();summary()}
async function reportStatus(id,status){await api('PUT','/api/admin/reports/'+id,{status});loadReports();summary()}

async function loadBooks(){const q=$('q')?.value||'';const rows=await api('GET','/api/admin/books?q='+encodeURIComponent(q));$('content').innerHTML=`<h2>Libros</h2>${searchBox('loadBooks','Buscar título, autor o género')}<table><tr><th>Libro</th><th>Dueño</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr>${rows.map(b=>`<tr><td>${b.photos?.[0]?`<img style="width:50px;height:68px;object-fit:cover;border-radius:8px" src="${esc(b.photos[0])}">`:''}<br><b>${esc(b.title)}</b><br>${esc(b.author)} · ${esc(b.genre)}</td><td>@${esc(b.owner?.username||'—')}<br>${esc(b.owner?.email||'')}</td><td>${pill(b.available?'Activo':'No disponible',b.available?'green':'yellow')}</td><td>${fmt(b.createdAt)}</td><td><button class="btn danger" onclick="delBook('${b._id}')">Eliminar</button></td></tr>`).join('')}</table>`}
async function delBook(id){if(confirm('¿Eliminar libro?')){await api('DELETE','/api/admin/books/'+id);loadBooks();summary()}}

async function loadExchanges(status){const rows=await api('GET','/api/admin/exchanges?status='+encodeURIComponent(status||'all'));$('content').innerHTML=`<h2>Intercambios</h2><table><tr><th>Usuarios</th><th>Libros</th><th>Estado</th><th>Fecha</th></tr>${rows.map(x=>`<tr><td>${((x.participants||[]).map(p=>'@'+esc(p.username)+'<br>'+esc(p.email)).join('<hr>'))}</td><td>${esc(x.myBook?.title||'—')} ⇄ ${esc(x.theirBook?.title||'—')}</td><td>${pill(x.status,x.status==='completed'?'green':'yellow')}</td><td>${fmt(x.updatedAt)}</td></tr>`).join('')}</table>`}
async function loadVerifications(){const rows=await api('GET','/api/admin/verifications');$('content').innerHTML=`<h2>Verificación de fotos</h2>${!rows.length?'<div style="padding:26px;text-align:center;color:#64748B">No hay fotos pendientes.</div>':`<table><tr><th>Foto</th><th>Usuario</th><th>Datos</th><th>Estado</th><th>Acciones</th></tr>${rows.map(u=>`<tr><td>${u.profilePhoto?`<a href="${esc(u.profilePhoto)}" target="_blank"><img class="avatar" src="${esc(u.profilePhoto)}" style="width:76px;height:76px"></a>`:'Sin foto'}</td><td><b>@${esc(u.username)}</b><br>${esc(u.email)}</td><td>${esc(u.location||'Sin comuna')}<br>${u.completedExchanges||0} intercambios<br>${esc(u.level||'Aficionado')}</td><td>${pill(u.verificationStatus||'pending')}</td><td><button class="btn" onclick="verifyPhoto('${u._id}','verified')">Aprobar</button> <button class="btn secondary" onclick="verifyPhoto('${u._id}','rejected')">Rechazar</button></td></tr>`).join('')}</table>`}`}
async function verifyPhoto(id,status){await api('PUT','/api/admin/users/'+id+'/verification',{status});await summary();await loadVerifications()}
async function loadActions(){const rows=await api('GET','/api/admin/actions');$('content').innerHTML=`<h2>Historial acciones admin</h2><table><tr><th>Admin</th><th>Acción</th><th>Target</th><th>Detalle</th><th>Fecha</th></tr>${rows.map(a=>`<tr><td>@${esc(a.admin?.username||'—')}<br>${esc(a.admin?.email||'')}</td><td>${pill(a.action)}</td><td>${esc(a.targetType)}<br>${esc(a.targetId)}</td><td><pre>${esc(JSON.stringify(a.detail||{},null,2))}</pre></td><td>${fmt(a.createdAt)}</td></tr>`).join('')}</table>`}

window.loadDashboard=loadDashboard;
window.loadUsers=loadUsers;
window.loadBooks=loadBooks;
window.loadReports=loadReports;
window.loadVerifications=loadVerifications;
window.loadActions=loadActions;
window.refresh=refresh;
window.changeRole=changeRole;
window.statusUser=statusUser;
window.deleteUser=deleteUser;
window.openUserDetail=openUserDetail;
window.openReportDetail=openReportDetail;
document.addEventListener('DOMContentLoaded',refresh);
setTimeout(()=>{if($('loading')&&$('loading').style.display!=='none')showNoAccess('El panel tardó demasiado en abrir. Recarga la página o verifica que el deploy esté activo.')},18000);
</script>
</body>
</html>
