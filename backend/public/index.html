<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Booktrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#FFFFFF;font-family:'DM Sans',sans-serif;color:#111827;overflow:hidden}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:#FFFFFF;height:100vh}
#view{position:absolute;top:0;left:0;right:0;bottom:68px;overflow-y:auto;overflow-x:hidden;background:#FFFFFF}
#view::-webkit-scrollbar{display:none}
#nav{position:fixed!important;bottom:0!important;left:50%!important;transform:translateX(-50%)!important;width:100%!important;max-width:480px!important;height:68px!important;background:#FFFFFF!important;border-top:1px solid #FED7AA!important;display:flex!important;align-items:center!important;padding:0 4px!important;z-index:999999!important;box-shadow:0 -8px 24px rgba(17,24,39,.06)!important}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;border:none;background:transparent;cursor:pointer;color:#9CA3AF;font-size:10px;font-weight:500;font-family:inherit;transition:color .2s,transform .2s;padding:0}
.nb.active{color:#F97316;font-weight:700}
.nb:active{transform:scale(.96)}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spin{width:32px;height:32px;border:3px solid #FED7AA;border-top-color:#F97316;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes matchPop{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
input,textarea,select,button{font-family:'DM Sans',sans-serif}button{cursor:pointer}a{text-decoration:none}

/* Módulo legal login — Nosotros / Términos / Privacidad / Comunidad */
#bt-legal-links{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid rgba(254,215,170,.75);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
#bt-legal-links button{
  border:1px solid #FED7AA;
  background:#FFF7ED;
  color:#6B7280;
  padding:8px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  line-height:1;
}
#bt-legal-links button:active{transform:scale(.97)}
#bt-info-modal{
  position:fixed;
  inset:0;
  z-index:10000050;
  background:rgba(17,24,39,.66);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
#bt-info-modal.bt-open{display:flex}
.bt-info-card{
  width:min(92vw,520px);
  max-height:82vh;
  overflow-y:auto;
  background:#FFFFFF;
  color:#111827;
  border:1px solid #FED7AA;
  border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
  padding:24px;
  position:relative;
}
.bt-info-close{
  position:absolute;
  top:12px;
  right:14px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#F97316;
  color:#FFFFFF;
  font-size:23px;
  font-weight:700;
  line-height:34px;
}
.bt-info-card h2{
  font-family:'Fraunces',serif;
  color:#F97316;
  font-size:24px;
  margin:0 42px 14px 0;
}
.bt-info-card p{
  color:#374151;
  line-height:1.55;
  font-size:14px;
  margin-bottom:12px;
}
.bt-info-card ul{
  padding-left:18px;
  color:#374151;
  font-size:14px;
  line-height:1.55;
  margin-bottom:12px;
}
.bt-info-card li{margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
</div>

<div id="nav">
  <button class="nb" id="nb-discover" onclick="window.showDiscover?showDiscover():alert('app.js todavía no cargó')">
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>Descubrir</span>
  </button>
  <button class="nb" id="nb-books" onclick="window.showBooks?showBooks():alert('app.js todavía no cargó')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/></svg><span>Mis Libros</span>
  </button>
  <button class="nb" id="nb-matches" onclick="window.showMatches?showMatches():alert('app.js todavía no cargó')">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="nb-mlabel">Matches</span>
  </button>
  <button class="nb" id="nb-profile" onclick="window.showProfile?showProfile():alert('app.js todavía no cargó')">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span>
  </button>
</div>

<div id="toasts" style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:999999;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:340px;width:90%"></div>

<div id="bt-info-modal" onclick="if(event.target===this)btCloseInfoModal()">
  <div class="bt-info-card">
    <button class="bt-info-close" type="button" onclick="btCloseInfoModal()">×</button>
    <h2 id="bt-info-title">Booktrade</h2>
    <div id="bt-info-body"></div>
  </div>
</div>

<script>
window.__BOOKSWIPE_VERSION__ = "1776997209-legal-login";

setInterval(function(){
  var nav=document.getElementById('nav');
  var view=document.getElementById('view');
  if(nav && !window.__CHAT_OPEN__){nav.style.setProperty('display','flex','important');nav.style.setProperty('z-index','999999','important');}
  if(view){view.style.setProperty('bottom','68px','important');}
},500);

/* Módulo legal recuperado para el login */
(function(){
  var legalContent = {
    nosotros: {
      title: 'Nosotros',
      html: '<p><b>Booktrade</b> es una plataforma creada para conectar personas que quieren intercambiar libros de forma simple, cercana y segura.</p><p>Nuestro objetivo es fomentar la lectura, darle nueva vida a los libros usados y crear una comunidad lectora activa.</p><p>La app permite publicar libros, descubrir otros usuarios, generar matches y coordinar intercambios mediante chat.</p>'
    },
    terminos: {
      title: 'Términos y condiciones',
      html: '<p>Al usar Booktrade aceptas utilizar la plataforma de manera responsable, respetuosa y honesta.</p><ul><li>Debes publicar libros reales y datos verdaderos.</li><li>Cada intercambio debe ser coordinado directamente entre los usuarios.</li><li>Booktrade facilita el contacto, pero no se hace responsable por acuerdos externos entre usuarios.</li><li>La administración podrá moderar, bloquear o eliminar cuentas que incumplan las reglas.</li></ul>'
    },
    privacidad: {
      title: 'Política de protección de datos',
      html: '<p>La información de los usuarios se utiliza únicamente para el funcionamiento de la plataforma.</p><ul><li>No vendemos datos personales.</li><li>Las fotos, mensajes y datos de perfil se usan para permitir matches, chats, verificación y seguridad dentro de Booktrade.</li><li>El usuario puede solicitar revisión o eliminación de su información contactando a soporte.</li><li>Las fotos de perfil pueden ser revisadas por administración antes de mostrarse públicamente.</li></ul>'
    },
    comunidad: {
      title: 'Reglas de la comunidad',
      html: '<p>Booktrade busca mantener una comunidad segura, respetuosa y enfocada en la lectura.</p><ul><li>No se permite acosar, insultar, amenazar o discriminar a otros usuarios.</li><li>No se permite publicar contenido falso, ofensivo, ilegal o ajeno al intercambio de libros.</li><li>No se permite usar la plataforma para estafas, spam o fines comerciales no autorizados.</li><li>Los usuarios pueden ser reportados, bloqueados o eliminados por administración si incumplen estas reglas.</li></ul>'
    }
  };

  window.btOpenInfoModal = function(type){
    var data = legalContent[type];
    if(!data) return;
    var modal = document.getElementById('bt-info-modal');
    var title = document.getElementById('bt-info-title');
    var body = document.getElementById('bt-info-body');
    if(!modal || !title || !body) return;
    title.textContent = data.title;
    body.innerHTML = data.html;
    modal.classList.add('bt-open');
  };

  window.btCloseInfoModal = function(){
    var modal = document.getElementById('bt-info-modal');
    if(modal) modal.classList.remove('bt-open');
  };

  window.btInjectLegalLinks = function(){
    var view = document.getElementById('view');
    if(!view) return;
    var txt = view.textContent || '';
    var looksLikeAuth = (txt.indexOf('Ingresar') !== -1 && (txt.indexOf('Registrarse') !== -1 || txt.indexOf('Crear cuenta') !== -1));
    if(!looksLikeAuth) return;
    if(document.getElementById('bt-legal-links')) return;

    var divs = Array.prototype.slice.call(view.querySelectorAll('div'));
    var target = divs.find(function(el){
      var st = el.getAttribute('style') || '';
      var t = el.textContent || '';
      return st.indexOf('max-width:400px') !== -1 && t.indexOf('Ingresar') !== -1;
    });

    if(!target){
      target = divs.find(function(el){
        var t = el.textContent || '';
        return t.indexOf('Ingresar') !== -1 && t.indexOf('Registrarse') !== -1;
      });
    }
    if(!target) return;

    var links = document.createElement('div');
    links.id = 'bt-legal-links';
    links.innerHTML =
      '<button type="button" onclick="btOpenInfoModal(\\'nosotros\\')">Nosotros</button>' +
      '<button type="button" onclick="btOpenInfoModal(\\'terminos\\')">Términos</button>' +
      '<button type="button" onclick="btOpenInfoModal(\\'privacidad\\')">Protección de datos</button>' +
      '<button type="button" onclick="btOpenInfoModal(\\'comunidad\\')">Reglas comunidad</button>';
    target.appendChild(links);
  };

  function patchShowAuth(){
    if(window.__BT_LEGAL_PATCHED__) return;
    if(typeof window.showAuth !== 'function') return;
    var original = window.showAuth;
    window.showAuth = function(tab){
      var result = original.apply(this, arguments);
      setTimeout(window.btInjectLegalLinks, 0);
      setTimeout(window.btInjectLegalLinks, 80);
      return result;
    };
    window.__BT_LEGAL_PATCHED__ = true;
  }

  window.addEventListener('load', function(){
    patchShowAuth();
    setTimeout(window.btInjectLegalLinks, 100);
    setTimeout(window.btInjectLegalLinks, 500);
  });

  setInterval(function(){
    patchShowAuth();
    window.btInjectLegalLinks();
  }, 700);
})();
</script>
<script src="/socket.io/socket.io.js"></script>
<script>
if (typeof io === 'undefined') {
  document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
}
</script>
<script src="./app.js?v=1776997209-legal-login"></script>
</body>
</html>
